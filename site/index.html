<!-- Câu 1a: viết trang danh sách sự kiện tại đây -->
<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sự kiện sắp diễn ra - EduHub Web</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="site-header">
    <a class="logo" href="index.html">
      <img src="img/og-image.png" alt="Logo EduHub Web">
      <span>EduHub Web</span>
    </a>
    <nav>
      <ul class="menu">
        <li><a href="index.html">Trang chủ</a></li>
        <li><a href="index.html">Sự kiện</a></li>
        <li><a href="#">Đăng ký</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Sự kiện sắp diễn ra</h1>

    <form id="search-form">
      <label for="keyword">Tìm sự kiện</label>
      <input type="search" id="keyword" name="keyword" placeholder="Tìm sự kiện...">
      <button type="submit">Tìm</button>
    </form>

    <p id="status"></p>

    <div id="event-list">
      <article class="card">
        <img src="img/event.svg" alt="Workshop Git & GitHub cho tân sinh viên">
        <h2><a href="event-detail.html?id=1">Workshop Git & GitHub cho tân sinh viên</a></h2>
        <p><time datetime="2026-09-12T08:00">08:00, 12/09/2026</time></p>
        <p>Phòng máy A3.201</p>
        <p>Còn 12/40 chỗ</p>
        <button type="button" class="btn-book" data-id="1">Đặt chỗ</button>
      </article>

      <article class="card card-full">
        <img src="img/event.svg" alt="Hackathon EduHub 24 giờ">
        <h2><a href="event-detail.html?id=2">Hackathon EduHub 24 giờ</a></h2>
        <p><time datetime="2026-12-19T08:00">08:00, 19/12/2026</time></p>
        <p>Phòng máy A3.205</p>
        <p><span class="badge">Hết chỗ</span></p>
        <button type="button" class="btn-book" data-id="2" disabled>Hết chỗ</button>
      </article>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 EduHub Web</p>
  </footer>

    <dialog id="login-dialog">
    <form id="login-form">
      <h2>Đăng nhập để đặt chỗ</h2>

      <label for="login-email">Email</label>
      <input type="email" id="login-email" required>

      <label for="login-password">Mật khẩu</label>
      <input type="password" id="login-password" required>

      <p id="login-error" class="form-error" role="alert"></p>

      <div class="dialog-actions">
        <button type="button" id="login-cancel" class="btn-secondary">Huỷ</button>
        <button type="submit" class="btn-book">Đăng nhập</button>
      </div>
    </form>
  </dialog>

  <script src="js/app.js"></script>
</body>

</html>
